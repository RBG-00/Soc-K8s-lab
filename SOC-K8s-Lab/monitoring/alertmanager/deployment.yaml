apiVersion: apps/v1
kind: Deployment

metadata:
  name: alertmanager
  namespace: monitoring
  labels:
    app: alertmanager

spec:
  replicas: 1

  selector:
    matchLabels:
      app: alertmanager

  template:
    metadata:
      labels:
        app: alertmanager

    spec:
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.33.1
          imagePullPolicy: IfNotPresent

          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
            - --web.listen-address=:9093

          ports:
            - name: web
              containerPort: 9093
              protocol: TCP

          volumeMounts:
            - name: alertmanager-config
              mountPath: /etc/alertmanager
              readOnly: true

            - name: slack-webhook
              mountPath: /etc/alertmanager/secrets
              readOnly: true

          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9093
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9093
            initialDelaySeconds: 15
            periodSeconds: 15

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"

            limits:
              cpu: "200m"
              memory: "256Mi"

      volumes:
        - name: alertmanager-config
          configMap:
            name: alertmanager-config

        - name: slack-webhook
          secret:
            secretName: alertmanager-slack