apiVersion: v1
kind: PersistentVolumeClaim

metadata:
  name: mariadb-data-pvc
  namespace: web

spec:
  accessModes:
    - ReadWriteOnce

  resources:
    requests:
      storage: 2Gi

---

apiVersion: apps/v1
kind: Deployment

metadata:
  name: mariadb
  namespace: web

spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: mariadb

  template:
    metadata:
      labels:
        app: mariadb

    spec:
      containers:
        - name: mariadb

          image: mariadb:11
          imagePullPolicy: IfNotPresent

          ports:
            - name: mysql
              containerPort: 3306
              protocol: TCP

          env:
            - name: MARIADB_ROOT_PASSWORD
              value: root

            - name: MARIADB_DATABASE
              value: dvwa

            - name: MARIADB_USER
              value: dvwa

            - name: MARIADB_PASSWORD
              value: password

          volumeMounts:
            - name: mariadb-data
              mountPath: /var/lib/mysql

          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - mariadb-admin ping -h 127.0.0.1 -uroot -p"$MARIADB_ROOT_PASSWORD"
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - mariadb-admin ping -h 127.0.0.1 -uroot -p"$MARIADB_ROOT_PASSWORD"
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

      volumes:
        - name: mariadb-data
          persistentVolumeClaim:
            claimName: mariadb-data-pvc

---

apiVersion: v1
kind: Service

metadata:
  name: mariadb
  namespace: web

spec:
  type: ClusterIP

  selector:
    app: mariadb

  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
      protocol: TCP