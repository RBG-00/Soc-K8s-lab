<ossec_config>

  <client>
    <server>
      <address>host.docker.internal</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
  </client>

  <syscheck>
    <frequency>20</frequency>

    <directories check_all="yes">/etc</directories>
    <directories check_all="yes">/tmp</directories>
    <directories check_all="yes">/opt</directories>
  </syscheck>

  <!-- General system logs -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/*.log</location>
  </localfile>

  <!-- SSH and sudo logs -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/auth.log</location>
  </localfile>

</ossec_config>