apiVersion: apps/v1
kind: Deployment

metadata:
  name: ubuntu
  namespace: linux
  labels:
    app: ubuntu

spec:
  replicas: 1

  selector:
    matchLabels:
      app: ubuntu

  template:
    metadata:
      labels:
        app: ubuntu

    spec:
      containers:

        - name: ubuntu
          image: ubuntu:1.0
          imagePullPolicy: Never

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"

            limits:
              cpu: "1"
              memory: "512Mi"

        